<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoQuiz 학습 리포트</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=49">
    <link rel="icon" href="Favicon.png?v=4">
</head>
<body>
<div class="report-wrap">
    <header class="report-head">
        <img src="VoQuiz_Logo_Light.png?v=4" alt="VoQuiz" class="report-logo">
        <button class="icon-btn theme-toggle-btn" onclick="toggleTheme()" title="테마 전환">🌙</button>
    </header>
    <div id="report-body">
        <div class="report-loading">리포트를 불러오는 중…</div>
    </div>
    <footer class="report-foot">VoQuiz · AI 단어 학습 리포트</footer>
</div>

<div id="attempt-modal" class="modal-overlay hidden" onclick="closeAttempt(event)">
    <div class="modal-card" onclick="event.stopPropagation()" style="max-width:640px">
        <button class="btn-close" onclick="closeAttempt()" style="position:absolute;top:12px;right:14px">×</button>
        <div id="attempt-modal-body"></div>
    </div>
</div>

<script src="report.js?v=3"></script>
</body>
</html>
